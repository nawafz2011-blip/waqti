<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>وقتي · رسائل البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Readex+Pro:wght@600;700&display=swap">
<style>
  :root {
    --bg:#0b1220; --card:#141d2f; --line:#22304a; --fg:#eef2f8; --muted:#8fa0bb;
    --blue:#5b8cff; --green:#34d399; --amber:#fbbf24; --red:#f87171; --purple:#c084fc;
    --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:18px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-family:var(--display); font-size:1.7rem; }
  .sub { color:var(--muted); font-size:.95rem; margin-top:2px; }
  .live { display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); background:var(--card);
          border:1px solid var(--line); padding:6px 12px; border-radius:999px; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(52,211,153,.6); animation:pulse 2s infinite; }
  .dot.off { background:var(--muted); animation:none; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(52,211,153,0); } 100% { box-shadow:0 0 0 0 rgba(52,211,153,0); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font:inherit; font-size:.9rem; color:var(--muted); background:transparent; border:1px solid var(--line);
          border-radius:999px; padding:6px 14px; cursor:pointer; }
  .chip[aria-pressed="true"] { color:var(--bg); background:var(--fg); border-color:var(--fg); font-weight:600; }
  #list { display:flex; flex-direction:column; gap:10px; }
  .day { color:var(--muted); font-size:.85rem; font-weight:600; margin:8px 4px 0; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
       display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start; }
  .ic { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-size:1.15rem; background:rgba(255,255,255,.06); }
  .t { line-height:1.7; min-width:0; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:.8rem; text-align:left; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .k-warn .ic { background:rgba(251,191,36,.14); } .k-bad .ic { background:rgba(248,113,113,.14); }
  .k-good .ic { background:rgba(52,211,153,.14); } .k-info .ic { background:rgba(91,140,255,.14); }
  .k-law .ic { background:rgba(192,132,252,.14); }
  .note { color:var(--amber); font-size:.85rem; background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.25);
          border-radius:10px; padding:8px 12px; }
  .adm { border-color:rgba(192,132,252,.45); }
  .tag { display:inline-block; font-size:.75rem; color:var(--purple); border:1px solid rgba(192,132,252,.4);
         border-radius:999px; padding:0 8px; margin-inline-end:6px; }
  a.ok { display:inline-block; margin-top:8px; background:var(--green); color:#062b1d; font-weight:700;
         text-decoration:none; border-radius:10px; padding:8px 18px; }
  .ctl { background:var(--card); border:1px solid rgba(192,132,252,.45); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .ctl-h { font-weight:700; color:var(--purple); }
  .ppl { display:flex; flex-direction:column; gap:8px; }
  .pr { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pr .n { font-weight:600; }
  .pr .acts { display:flex; gap:6px; }
  .b { font:inherit; font-weight:700; border:0; border-radius:9px; padding:7px 12px; cursor:pointer; background:var(--line); color:var(--fg); }
  .b.kick { background:rgba(248,113,113,.18); color:var(--red); }
  .b.allow { background:rgba(52,211,153,.16); color:var(--green); }
  .now { border-color:rgba(52,211,153,.4); }
  .now .ctl-h { color:var(--green); }
  .nr { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .nr .n { font-weight:600; }
  .chip2 { font-size:.85rem; font-weight:700; border-radius:999px; padding:3px 12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .c-playing { background:rgba(52,211,153,.16); color:var(--green); }
  .c-open { background:rgba(251,191,36,.16); color:var(--amber); }
  .c-blocked { background:rgba(248,113,113,.18); color:var(--red); }
  .c-done { background:rgba(143,160,187,.14); color:var(--muted); }
  .c-idle { background:rgba(91,140,255,.14); color:var(--blue); }
  .nowt { color:var(--muted); font-size:.8rem; }
  .b.out { background:rgba(251,191,36,.16); color:var(--amber); }
  .b.reset { background:rgba(91,140,255,.16); color:var(--blue); }
  .b.adj { background:rgba(52,211,153,.16); color:#34d399; }
  .adjrow { display:flex; gap:8px; align-items:center; }
  .adjrow .b { flex:0 0 auto; padding:10px 14px; font-size:1.1rem; }
  .ask .adjrow input { flex:1; min-width:0; width:0; letter-spacing:normal; }
  .adjrow .b { min-width:52px; }
  .b.all { background:rgba(91,140,255,.16); color:var(--blue); width:100%; padding:10px; margin-top:4px; }
  .pr .acts { flex-wrap:wrap; justify-content:flex-end; }
  .b.go { background:var(--green); color:#062b1d; }
  .ask { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:12px; }
  .ask input { font-size:1.3rem; text-align:center; letter-spacing:.3em; padding:10px; border-radius:9px; border:0; }
  .row { display:flex; gap:8px; } .row .b { flex:1; }
  .st { min-height:1.4em; font-weight:700; text-align:center; }
  .st.bad { color:var(--red); } .st.okc { color:var(--green); }
  .empty { color:var(--muted); text-align:center; padding:40px 16px; border:1px dashed var(--line); border-radius:14px; }
  footer { color:var(--muted); font-size:.8rem; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>⏱ وقتي</h1>
      <div class="sub" id="sub">رسائل البيت · للقراءة بس</div>
    </div>
    <div class="live" id="live"><span class="dot" id="dot"></span><span id="livetxt">مباشر</span></div>
  </header>

  <div class="chips" role="group" aria-label="فلتر">
    <button class="chip" data-f="all" aria-pressed="true">الكل</button>
    <button class="chip" data-f="warn" aria-pressed="false">⚠️ تنبيهات</button>
    <button class="chip" data-f="extra" aria-pressed="false">وقت إضافي</button>
    <button class="chip" data-f="round" aria-pressed="false">الدور والريست</button>
  </div>

  <section id="now" class="ctl now" hidden>
    <div class="ctl-h">🎮 الحين</div>
    <div id="nowl" class="ppl"></div>
    <div id="nowt" class="nowt"></div>
  </section>
  <section id="ctl" class="ctl" hidden>
    <div class="ctl-h">👑 تحكم المنظم</div>
    <div id="ppl" class="ppl"></div>
    <button id="pinbtn" class="b all" type="button">🔑 تغيير رمز الكبير</button>
    <div id="pinbox" class="ask" hidden>
      <div class="askt">تغيير رمز الكبير</div>
      <input id="oldpin" type="password" autocomplete="off" placeholder="الرمز الحالي">
      <input id="newpin" type="password" autocomplete="off" placeholder="الرمز الجديد">
      <input id="newpin2" type="password" autocomplete="off" placeholder="أعد الرمز الجديد">
      <div class="row"><button id="pgo" class="b go" type="button">غيّر الرمز</button><button id="pcancel" class="b" type="button">إلغاء</button></div>
      <div id="pst" class="st" role="status"></div>
    </div>
    <div id="ask" class="ask" hidden>
      <div id="askt" class="askt"></div>
      <div id="adjbox" class="adjrow" hidden>
        <button id="adjm" class="b" type="button">−</button>
        <input id="adjh" type="text" inputmode="numeric" autocomplete="off" placeholder="ساعات">
        <input id="adjmin" type="text" inputmode="numeric" autocomplete="off" placeholder="دقايق">
        <button id="adjp" class="b" type="button">+</button>
      </div>
      <div id="adjnote" class="st" hidden></div>
      <input id="pin" type="password" autocomplete="off" placeholder="رمز الكبير">
      <div class="row"><button id="go" class="b go" type="button">تأكيد</button><button id="cancel" class="b" type="button">إلغاء</button></div>
      <div id="st" class="st" role="status"></div>
    </div>
  </section>
  <div id="note" class="note" hidden></div>
  <div id="list"></div>
  <footer>آخر 12 ساعة · السجل الكامل في البرنامج</footer>
</div>
<script>
(function () {

  // قاعدتنا (Firebase): نفس شكل رسائل ntfy القديم عشان باقي الصفحة ما يتغير
  var FB = "https://waqti-47a62-default-rtdb.europe-west1.firebasedatabase.app/r/";
  function fk(t) { return t.length >= 20 ? t : t + "-pub-feed"; }
  function fbPath(t) { var i = t.indexOf("-res-"); return i >= 0 ? fk(t.slice(0, i) + "-res") + "/" + t.slice(i + 5) : fk(t); }
  function fbEv(id, v) { return v && typeof v === "object" && "m" in v ? { event: "message", id: id, time: Math.floor((v.t || 0) / 1000), message: v.m, click: v.c || "", title: v.ti || "" } : null; }
  function fbPush(t, obj) { return fetch(FB + fbPath(t) + ".json", { method: "POST", body: JSON.stringify({ m: JSON.stringify(obj), t: { ".sv": "timestamp" } }) })
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r; }); }
  // قائمة رسائل: كل رسالة (قديمة وجديدة) توصل لـ onEv
  function fbList(t, onEv, onOpen, onErr) {
    var es = new EventSource(FB + fbPath(t) + ".json");
    function h(e) { try { var d = JSON.parse(e.data); if (!d) return; var v = d.data, p = d.path, out = [];
      if (p === "/") { if (v && typeof v === "object") Object.keys(v).forEach(function (k) { out.push(fbEv(k, v[k])); }); }
      else { var k = p.split("/")[1]; if (p.split("/").length === 2) out.push(fbEv(k, v)); }
      out.forEach(function (ev) { if (ev && ev.time > Date.now() / 1000 - 12 * 3600) onEv(ev); }); } catch (x) {} }
    es.addEventListener("put", h); es.addEventListener("patch", h);
    if (onOpen) es.onopen = onOpen; if (onErr) es.onerror = onErr;
    return es;
  }
  // قيمة وحدة (مين يلعب، الأسماء، رد الكمبيوتر)
  function fbValue(t, onVal) {
    var es = new EventSource(FB + fbPath(t) + ".json"), cur = null;
    function h(e) { try { var d = JSON.parse(e.data); if (!d) return; var p = d.path, v = d.data;
      if (p === "/") cur = e.type === "patch" ? Object.assign(cur || {}, v) : v;
      else { cur = cur || {}; cur[p.split("/")[1]] = v; }
      if (cur && "m" in cur) onVal(fbEv("v", cur)); } catch (x) {} }
    es.addEventListener("put", h); es.addEventListener("patch", h);
    return es;
  }
  // ننتظر رد الكمبيوتر (يوصل على طول). بعد 20 ثانية بدون رد: الأمر محفوظ ويتنفذ أول ما يشتغل البرنامج
  function waitRes(topic, since, onDone, onTimeout) {
    var finished = false, es = fbValue(topic, function (ev) { if (!finished) { finished = true; es.close(); onDone(ev.message); } });
    setTimeout(function () { if (!finished) { finished = true; es.close(); onTimeout(); } }, 20000);
  }
  var q = new URLSearchParams(location.search);
  var topic = q.get("t"), pk = q.get("k"), admin = q.get("a");
  var hidden = 0, keyP = null;
  function unhex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  if (pk && window.crypto && crypto.subtle) {
    keyP = crypto.subtle.importKey("raw", unhex(pk), { name: "Ed25519" }, false, ["verify"]).catch(function () { return null; });
  }
  function genuine(ev) {
    if (!pk) return Promise.resolve(true);
    if (!keyP) return Promise.resolve(false);
    var hp = (ev.click || "").split("#")[1] || "", hq = new URLSearchParams(hp);
    var sig = hq.get("s"), ts = parseInt(hq.get("ts") || "0", 10);
    if (!sig || sig.length !== 128 || Math.abs(ts - ev.time) > 600) return Promise.resolve(false);
    return keyP.then(function (key) {
      if (!key) return false;
      return crypto.subtle.verify({ name: "Ed25519" }, key, unhex(sig), new TextEncoder().encode(ts + "|" + ev.message));
    }).catch(function () { return false; });
  }
  var list = document.getElementById("list"), dot = document.getElementById("dot"), livetxt = document.getElementById("livetxt");
  var msgs = [], seen = {}, filter = "all";

  function kind(text) {
    if (/⛔|🔒|❌/.test(text)) return "bad";
    if (/⚖️/.test(text)) return "law";
    if (/⚠️|⏰/.test(text)) return "warn";
    if (/✅/.test(text)) return "good";
    return "info";
  }
  function icon(text) {
    var m = text.match(/^(⛔|🔒|⚖️|⚠️|⏰|✅|🔄|📨)/);
    return m ? m[1] : "⏱";
  }
  function group(text) {
    if (/دور|ريست/.test(text)) return "round";
    if (/إضافي|ما أحد صاحي|الوقت المفتوح/.test(text)) return "extra";
    if (kind(text) === "warn" || kind(text) === "bad" || kind(text) === "law") return "warn";
    return "other";
  }
  function clean(m) {
    return (m || "").replace(/^⏱ وقتي\n/, "").replace(/\nالساعة \d\d:\d\d$/, "").trim();
  }
  function h12(d) { var h = d.getHours() % 12 || 12; return h + ":" + ("0" + d.getMinutes()).slice(-2) + (d.getHours() < 12 ? " ص" : " م"); }
  function hm(ts) { return h12(new Date(ts * 1000)); }
  function dayName(ts) {
    var d = new Date(ts * 1000), n = new Date(), y = new Date(); y.setDate(n.getDate() - 1);
    if (d.toDateString() === n.toDateString()) return "اليوم";
    if (d.toDateString() === y.toDateString()) return "أمس";
    return d.getDate() + "/" + (d.getMonth() + 1);
  }
  function render() {
    var shown = msgs.filter(function (m) { return filter === "all" || group(m.text) === filter; })
                    .sort(function (a, b) { return b.time - a.time; });
    list.innerHTML = "";
    var note = document.getElementById("note");
    note.hidden = !hidden;
    note.textContent = "🛡️ انخفت " + hidden + " رسالة بدون ختم البرنامج (قديمة أو مزورة).";
    if (!topic) { list.innerHTML = '<div class="empty">الرابط ناقص. افتحه من «رابط الإشعارات» في البرنامج.</div>'; return; }
    if (!shown.length) { list.innerHTML = '<div class="empty">ما فيه رسائل للحين. أول ما يصير شي بيطلع هنا.</div>'; return; }
    var lastDay = null, ul = null;
    shown.forEach(function (m) {
      var dn = dayName(m.time);
      if (dn !== lastDay) {
        var h = document.createElement("div"); h.className = "day"; h.textContent = dn; list.appendChild(h);
        ul = document.createElement("ul"); list.appendChild(ul); lastDay = dn;
      }
      var li = document.createElement("li"); li.className = "k-" + kind(m.text);
      var ic = document.createElement("div"); ic.className = "ic"; ic.textContent = icon(m.text);
      var t = document.createElement("div"); t.className = "t"; t.textContent = m.text.replace(/^(⛔|🔒|⚖️|⚠️|⏰|✅|🔄|📨)\s*/, "");
      var meta = document.createElement("div"); meta.className = "meta"; meta.textContent = hm(m.time);
      if (m.admin) {
        li.className += " adm";
        var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "👑 للمنظم";
        t.prepend(tag);
        if (/index\.html|\/waqti\/\?/.test(m.link) && /[?&]r=/.test(m.link)) {
          var a = document.createElement("a"); a.className = "ok"; a.href = m.link; a.textContent = "وافق ✓";
          t.appendChild(document.createElement("br")); t.appendChild(a);
        }
      }
      li.appendChild(ic); li.appendChild(t); li.appendChild(meta); ul.appendChild(li);
    });
  }
  function addAdmin(ev) {
    if (!ev || ev.event !== "message" || seen[ev.id]) return;
    seen[ev.id] = 1;
    msgs.push({ time: ev.time, text: ev.message || "", admin: true, link: ev.click || "" });
  }
  function add(ev) {
    if (!ev || ev.event !== "message" || seen[ev.id]) return Promise.resolve();
    seen[ev.id] = 1;
    return genuine(ev).then(function (ok) {
      if (ok) msgs.push({ time: ev.time, text: clean(ev.message) });
      else hidden++;
    });
  }
  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () {
      filter = c.dataset.f;
      document.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", x === c ? "true" : "false"); });
      render();
    });
  });
  function live(on) { dot.className = on ? "dot" : "dot off"; livetxt.textContent = on ? "مباشر" : "يعيد الاتصال…"; }

  if (admin) {
    document.getElementById("sub").textContent = "👑 المنظم · رسائل البيت وطلبات الريست";
    var ctl = document.getElementById("ctl"), ppl = document.getElementById("ppl"), ask = document.getElementById("ask");
    var askt = document.getElementById("askt"), pinI = document.getElementById("pin"), st = document.getElementById("st");
    var pending = null, shownKey = null;
    ctl.hidden = false;
    var adjh = document.getElementById("adjh"), adjbox = document.getElementById("adjbox"), adjmin = document.getElementById("adjmin"), adjnote = document.getElementById("adjnote"), adjSign = 1;
    function drawAdj() {
      document.getElementById("adjp").className = "b " + (adjSign > 0 ? "adj" : "");
      document.getElementById("adjm").className = "b " + (adjSign < 0 ? "kick" : "");
      var m = adjTotal(), hh = Math.floor(m / 60), mm = m % 60;
      var txt = (hh ? hh + " ساعة" : "") + (hh && mm ? " و " : "") + (mm ? mm + " دقيقة" : "");
      adjnote.textContent = m ? (adjSign > 0 ? "بيزيد " : "بينقص ") + txt + " (لليوم بس)" : "اختر + أو − واكتب الساعات والدقايق";
    }
    document.getElementById("adjp").onclick = function () { adjSign = 1; drawAdj(); };
    document.getElementById("adjm").onclick = function () { adjSign = -1; drawAdj(); };
    function adjTotal() { return (parseInt(norm(adjh.value || "0"), 10) || 0) * 60 + (parseInt(norm(adjmin.value || "0"), 10) || 0); }
    adjmin.oninput = adjh.oninput = drawAdj;
    function showPeople(people) {
      var key = people.join(",");
      if (key === shownKey) return;
      shownKey = key;
      ppl.innerHTML = "";
      if (!people.length) {
        ppl.innerHTML = '<div class="st">ننتظر الأسماء من الكمبيوتر… (لازم البرنامج يكون شغال)</div>';
        return;
      }
    people.forEach(function (n) {
      var r = document.createElement("div"); r.className = "pr";
      var nm = document.createElement("span"); nm.className = "n"; nm.textContent = n;
      var acts = document.createElement("div"); acts.className = "acts";
      [["adjust", "عدّل وقته ⏱"], ["reset_time", "ريست وقته 🔄"], ["logout", "سجّل خروجه 🚪"], ["kick", "طلّعه وامنعه 🚫"], ["allow", "اسمح له ✅"]].forEach(function (a) {
        var b = document.createElement("button"); b.type = "button"; b.className = "b " + (a[0] === "adjust" ? "adj" : a[0] === "reset_time" ? "reset" : a[0] === "logout" ? "out" : a[0]); b.textContent = a[1];
        b.onclick = function () {
          pending = { cmd: a[0], who: n }; ask.hidden = false; st.textContent = ""; st.className = "st";
          adjSign = 1; adjbox.hidden = adjnote.hidden = a[0] !== "adjust"; adjmin.value = adjh.value = ""; drawAdj();
          askt.textContent = { kick: "تطلّع " + n + " من الجهاز وتمنعه يدخل؟", allow: "تسمح لـ " + n + " يدخل؟",
                               reset_time: "ترجع وقت " + n + " كامل؟", adjust: "كم تزيد أو تنقص من وقت " + n + " اليوم؟", logout: "تطلّع " + n + " من حسابه؟ (يقدر يرجع بعدين)" }[a[0]];
          pinI.value = ""; (a[0] === "adjust" ? adjh : pinI).focus();
        };
        acts.appendChild(b);
      });
      r.appendChild(nm); r.appendChild(acts); ppl.appendChild(r);
    });
    if (people.length) {
      var all = document.createElement("button"); all.type = "button"; all.className = "b all"; all.textContent = "🔄 ريست للكل (دور جديد، والكل يرجع له وقته)";
      all.onclick = function () {
        pending = { cmd: "reset_round", who: "الكل" }; ask.hidden = false; adjbox.hidden = adjnote.hidden = true; st.textContent = ""; st.className = "st";
        askt.textContent = "دور جديد والكل يرجع له وقته كامل؟"; pinI.value = ""; pinI.focus();
      };
      ppl.appendChild(all);
    }
    }
    var nowS = document.getElementById("now"), nowl = document.getElementById("nowl"), nowt = document.getElementById("nowt");
    var lastStatus = null;
    function hmLeft(sec) { var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? (h + " س " + m + " د") : (m + " د"); }
    function drawNow() {
      if (!lastStatus) return;
      nowS.hidden = false; nowl.innerHTML = "";
      var age = Math.max(0, Date.now() / 1000 - lastStatus.ts);
      lastStatus.players.forEach(function (p) {
        var left = p.state === "playing" ? Math.max(0, p.rem - age) : p.rem;
        var r = document.createElement("div"); r.className = "nr";
        var n = document.createElement("span"); n.className = "n"; n.textContent = p.name;
        var c = document.createElement("span"); c.className = "chip2 c-" + p.state;
        var endAt = new Date(Date.now() + left * 1000);
        var endTxt = " · ينتهي " + h12(endAt);
        c.textContent = { playing: "🟢 يلعب · باقي " + hmLeft(left) + endTxt, open: "🟠 وقت مفتوح", blocked: "🚫 ممنوع",
                          done: "خلص وقته", idle: "باقي " + hmLeft(left) }[p.state] || "";
        r.appendChild(n); r.appendChild(c); nowl.appendChild(r);
      });
      var ago = Math.max(0, Math.round((Date.now() / 1000 - lastStatus.ts) / 60));
      nowt.textContent = ago < 2 ? "تحدّث الحين" : ("آخر تحديث قبل " + ago + " دقيقة" + (ago > 75 ? " · الكمبيوتر يمكن مطفي" : ""));
    }
    fbValue(admin + "-status", function (ev) { try { var d = JSON.parse(ev.message);
      if (d.players && (!lastStatus || d.ts >= lastStatus.ts)) lastStatus = d; drawNow(); } catch (e) {} });
    setInterval(drawNow, 15000);
    nowS.hidden = false;
    nowl.innerHTML = '<div class="nowt">ننتظر أول تحديث من الكمبيوتر… (يوصل خلال دقيقة لو البرنامج شغال ونسخته 27 أو أكثر)</div>';
    var rkey = "waqti-roster-" + admin, saved = [];
    try { saved = JSON.parse(localStorage.getItem(rkey) || "[]"); } catch (e) {}
    var fromLink = (q.get("p") || "").split(",").filter(Boolean);
    showPeople(saved.length ? saved : fromLink);
    fbValue(admin + "-roster", function (ev) { try { var last = JSON.parse(ev.message).roster;
      if (last && last.length) { try { localStorage.setItem(rkey, JSON.stringify(last)); } catch (e) {} showPeople(last); } } catch (e) {} });
    var pinbox = document.getElementById("pinbox"), pst = document.getElementById("pst");
    document.getElementById("pinbtn").onclick = function () { pinbox.hidden = false; ask.hidden = true; pst.textContent = "";
      ["oldpin", "newpin", "newpin2"].forEach(function (i) { document.getElementById(i).value = ""; }); document.getElementById("oldpin").focus(); };
    document.getElementById("pcancel").onclick = function () { pinbox.hidden = true; };
    document.getElementById("pgo").onclick = function () {
      var o = document.getElementById("oldpin").value, n1 = document.getElementById("newpin").value, n2 = document.getElementById("newpin2").value;
      if (!o.trim() || !n1.trim()) { pst.className = "st bad"; pst.textContent = "اكتب الرمز الحالي والجديد"; return; }
      if (n1 !== n2) { pst.className = "st bad"; pst.textContent = "الرمزين الجديدة مو نفس بعض"; return; }
      var ts = String(Date.now()), id = Math.random().toString(36).slice(2, 10), since = Math.floor(Date.now() / 1000) - 5;
      pst.className = "st"; pst.textContent = "يرسل...";
      Promise.all([sha("waqti:" + norm(o)), sha("waqti:" + norm(n1))]).then(function (hs) {
        return sha(hs[0] + "set_pin|" + hs[1] + "|" + ts).then(function (p) {
          return fbPush(admin + "-ok", { cmd: "set_pin", who: hs[1], ts: ts, id: id, p: p });
        });
      }).then(function () {
        pst.textContent = "انرسل. ننتظر الكمبيوتر...";
        waitRes(admin + "-res-" + id, since, function (done) {
          var ok = done.indexOf("✅") >= 0; pst.className = "st " + (ok ? "okc" : "bad"); pst.textContent = ok ? "✅ تغيّر الرمز" : done;
          if (ok) setTimeout(function () { pinbox.hidden = true; }, 2500);
        }, function () { pst.className = "st okc"; pst.textContent = /^(adjust|reset)/.test(cmd) ? "الكمبيوتر طافي. انحفظ ✅ ويتنفذ أول ما يشتغل (لو اشتغل اليوم)" : "الكمبيوتر طافي. انحفظ ✅ ويتنفذ أول ما يشتغل"; });
      }).catch(function () { pst.className = "st bad"; pst.textContent = "ما انرسل. تأكد من النت."; });
    };
    document.getElementById("cancel").onclick = function () { ask.hidden = true; pending = null; };
    function sha(sv) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(sv)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }); }
    function norm(sv) { return sv.trim().replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; }).replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 1776; }); }
    document.getElementById("go").onclick = function () {
      if (!pending) { st.className = "st bad"; st.textContent = "اختر اسم أول: «طلّعه» أو «اسمح له»"; return; }
      if (!pinI.value.trim()) { st.className = "st bad"; st.textContent = "اكتب الرمز"; return; }
      var ts = String(Date.now()), id = Math.random().toString(36).slice(2, 10), cmd = pending.cmd, who = pending.who;
      if (cmd === "adjust") {
        var mins = adjTotal();
        if (mins <= 0 || mins > 1440) { st.className = "st bad"; st.textContent = "اكتب الساعات أو الدقايق (لين 24 ساعة)"; return; }
        cmd = "adjust:" + (adjSign * mins);
      }
      var since = Math.floor(Date.now() / 1000) - 5;
      st.className = "st"; st.textContent = "يرسل...";
      sha("waqti:" + norm(pinI.value)).then(function (h) { return sha(h + cmd + "|" + who + "|" + ts); }).then(function (p) {
        return fbPush(admin + "-ok", { cmd: cmd, who: who, ts: ts, id: id, p: p });
      }).then(function () {
        st.textContent = "انرسل. ننتظر الكمبيوتر...";
        waitRes(admin + "-res-" + id, since, function (done) {
          var ok = done.indexOf("✅") >= 0; st.className = "st " + (ok ? "okc" : "bad"); st.textContent = done;
          if (ok) setTimeout(function () { ask.hidden = true; }, 2500);
        }, function () { st.className = "st okc"; st.textContent = /^(adjust|reset)/.test(cmd) ? "الكمبيوتر طافي. انحفظ ✅ ويتنفذ أول ما يشتغل (لو اشتغل اليوم)" : "الكمبيوتر طافي. انحفظ ✅ ويتنفذ أول ما يشتغل"; });
      }).catch(function () { st.className = "st bad"; st.textContent = "ما انرسل. تأكد من النت."; });
    };
  }
  render();
  if (!topic) { live(false); return; }
  var redraw = null;
  function later() { clearTimeout(redraw); redraw = setTimeout(render, 150); }
  if (admin) fbList(admin, function (ev) { addAdmin(ev); later(); });
  fbList(topic, function (ev) { add(ev).then(later); }, function () { live(true); }, function () { live(false); });
})();
</script>
</body>
</html>
