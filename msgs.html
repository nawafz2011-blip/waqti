<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>وقتي · رسائل البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Readex+Pro:wght@600;700&display=swap">
<style>
  :root {
    --bg:#0b1220; --card:#141d2f; --line:#22304a; --fg:#eef2f8; --muted:#8fa0bb;
    --blue:#5b8cff; --green:#34d399; --amber:#fbbf24; --red:#f87171; --purple:#c084fc;
    --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:18px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-family:var(--display); font-size:1.7rem; }
  .sub { color:var(--muted); font-size:.95rem; margin-top:2px; }
  .live { display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); background:var(--card);
          border:1px solid var(--line); padding:6px 12px; border-radius:999px; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(52,211,153,.6); animation:pulse 2s infinite; }
  .dot.off { background:var(--muted); animation:none; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px rgba(52,211,153,0); } 100% { box-shadow:0 0 0 0 rgba(52,211,153,0); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font:inherit; font-size:.9rem; color:var(--muted); background:transparent; border:1px solid var(--line);
          border-radius:999px; padding:6px 14px; cursor:pointer; }
  .chip[aria-pressed="true"] { color:var(--bg); background:var(--fg); border-color:var(--fg); font-weight:600; }
  #list { display:flex; flex-direction:column; gap:10px; }
  .day { color:var(--muted); font-size:.85rem; font-weight:600; margin:8px 4px 0; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
       display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start; }
  .ic { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-size:1.15rem; background:rgba(255,255,255,.06); }
  .t { line-height:1.7; min-width:0; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:.8rem; text-align:left; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .k-warn .ic { background:rgba(251,191,36,.14); } .k-bad .ic { background:rgba(248,113,113,.14); }
  .k-good .ic { background:rgba(52,211,153,.14); } .k-info .ic { background:rgba(91,140,255,.14); }
  .k-law .ic { background:rgba(192,132,252,.14); }
  .note { color:var(--amber); font-size:.85rem; background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.25);
          border-radius:10px; padding:8px 12px; }
  .adm { border-color:rgba(192,132,252,.45); }
  .tag { display:inline-block; font-size:.75rem; color:var(--purple); border:1px solid rgba(192,132,252,.4);
         border-radius:999px; padding:0 8px; margin-inline-end:6px; }
  a.ok { display:inline-block; margin-top:8px; background:var(--green); color:#062b1d; font-weight:700;
         text-decoration:none; border-radius:10px; padding:8px 18px; }
  .ctl { background:var(--card); border:1px solid rgba(192,132,252,.45); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .ctl-h { font-weight:700; color:var(--purple); }
  .ppl { display:flex; flex-direction:column; gap:12px; }
  .pr { display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line); }
  .pr .n { font-weight:800; font-size:1.15rem; }
  .pr .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pr .acts .b { padding:10px 4px; text-align:center; white-space:nowrap; font-size:.95rem; }
  .pr .acts .b.allow { grid-column:1 / -1; }
  .b { font:inherit; font-weight:700; border:0; border-radius:9px; padding:7px 12px; cursor:pointer; background:var(--line); color:var(--fg); }
  .b.kick { background:rgba(248,113,113,.18); color:var(--red); }
  .b.allow { background:rgba(52,211,153,.16); color:var(--green); }
  .now { border-color:rgba(52,211,153,.4); }
  .now .ctl-h { color:var(--green); }
  .nr { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .nr .n { font-weight:600; }
  .chip2 { font-size:.85rem; font-weight:700; border-radius:999px; padding:3px 12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .c-playing { background:rgba(52,211,153,.16); color:var(--green); }
  .c-open { background:rgba(251,191,36,.16); color:var(--amber); }
  .c-blocked { background:rgba(248,113,113,.18); color:var(--red); }
  .c-done { background:rgba(143,160,187,.14); color:var(--muted); }
  .c-idle { background:rgba(91,140,255,.14); color:var(--blue); }
  .nowt { color:var(--muted); font-size:.8rem; }
  .b.out { background:rgba(251,191,36,.16); color:var(--amber); }
  .b.reset { background:rgba(91,140,255,.16); color:var(--blue); }
  .b.adj { background:rgba(52,211,153,.16); color:#34d399; }
  .adjrow { display:flex; gap:8px; align-items:center; }
  .adjrow .b { flex:0 0 auto; padding:10px 14px; font-size:1.1rem; }
  .ask .adjrow input { flex:1; min-width:0; width:0; letter-spacing:normal; }
  .adjrow .b { min-width:52px; }
  .b.all { background:rgba(91,140,255,.16); color:var(--blue); width:100%; padding:10px; margin-top:4px; }
  .b.say { background:rgba(52,211,153,.16); color:#34d399; }
  .b.watch { background:rgba(248,113,113,.16); color:#fca5a5; }
  .vbox { display:flex; flex-direction:column; gap:8px; align-items:stretch; }
  .b.vrec { padding:16px; font-size:1.15rem; background:rgba(52,211,153,.16); color:#34d399; }
  .b.vrec.on { background:rgba(248,113,113,.25); color:#fca5a5; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  .vbox audio { width:100%; }
  .setp, .pform { display:flex; flex-direction:column; gap:9px; border-top:1px solid var(--line); padding-top:12px; }
  .pform { border:1px solid var(--line); border-radius:12px; padding:12px; }
  .sp-h { font-weight:800; margin-top:4px; }
  .sp-p { display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:10px; background:rgba(255,255,255,.04); }
  .sp-p .top { display:flex; justify-content:space-between; gap:8px; font-weight:700; }
  .sp-p .top span:last-child { color:var(--muted, #94a3b8); font-weight:400; font-size:.92rem; }
  .sp-p .acts { display:flex; gap:6px; flex-wrap:wrap; }
  .fld { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.95rem; }
  .fld input, .fld select { width:120px; flex:0 0 auto; padding:9px; border-radius:8px; border:0; font:inherit; text-align:center; }
  .fld .hm { display:flex; gap:6px; } .fld .hm input { width:64px; }
  .fld.chk { justify-content:flex-start; } .fld.chk input { width:auto; }
  .fld input.dt { width:200px; } .fld select { width:150px; }
  .wtabs { display:flex; gap:8px; } .wtabs .b { flex:1; } .wtabs .b.on { background:rgba(91,140,255,.25); color:#93c5fd; }
  .wk { width:100%; border-collapse:collapse; font-size:.92rem; }
  .wk th, .wk td { padding:7px 4px; text-align:center; border-bottom:1px solid var(--line); }
  .wk th:first-child, .wk td:first-child { text-align:right; color:var(--muted, #94a3b8); }
  .wk tr.tot td { font-weight:800; border-bottom:0; color:var(--fg); } .wk tr.tot td.top { color:#fbbf24; }
  .wk td.today { background:rgba(91,140,255,.08); }
  .lockban { padding:10px; border-radius:10px; background:rgba(248,113,113,.15); color:#fca5a5; font-weight:800; text-align:center; margin-bottom:8px; }
  .live { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:12px; }
  .live img { width:100%; border-radius:10px; background:#000; min-height:120px; }
  .live .lh { display:flex; justify-content:space-between; align-items:center; font-weight:700; }
  .live .ans { font-size:1.3rem; font-weight:800; text-align:center; padding:8px; border-radius:10px; }
  .ans.ok { background:rgba(52,211,153,.18); color:#34d399; } .ans.no { background:rgba(248,113,113,.18); color:var(--red); }
  .ans.none { background:rgba(251,191,36,.16); color:var(--amber); } .ans.wait { background:rgba(248,113,113,.12); color:#fca5a5; }
  .ask textarea { font:inherit; font-size:1.1rem; padding:10px; border-radius:9px; border:0; min-height:90px; resize:vertical; }

  .b.go { background:var(--green); color:#062b1d; }
  .ask { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:12px; }
  .ask input { font-size:1.3rem; text-align:center; letter-spacing:.3em; padding:10px; border-radius:9px; border:0; }
  .row { display:flex; gap:8px; } .row .b { flex:1; }
  .st { min-height:1.4em; font-weight:700; text-align:center; }
  .st.bad { color:var(--red); } .st.okc { color:var(--green); }
  .empty { color:var(--muted); text-align:center; padding:40px 16px; border:1px dashed var(--line); border-radius:14px; }
  footer { color:var(--muted); font-size:.8rem; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>⏱ وقتي</h1>
      <div class="sub" id="sub">رسائل البيت · للقراءة بس</div>
    </div>
    <div class="live" id="live"><span class="dot" id="dot"></span><span id="livetxt">مباشر</span></div>
  </header>

  <div class="chips" role="group" aria-label="فلتر">
    <button class="chip" data-f="all" aria-pressed="true">الكل</button>
    <button class="chip" data-f="warn" aria-pressed="false">⚠️ تنبيهات</button>
    <button class="chip" data-f="extra" aria-pressed="false">وقت إضافي</button>
    <button class="chip" data-f="round" aria-pressed="false">الدور والريست</button>
  </div>

  <section id="now" class="ctl now" hidden>
    <div class="ctl-h">🎮 الحين</div>
    <div id="nowl" class="ppl"></div>
    <div id="nowt" class="nowt"></div>
  </section>
  <section id="ctl" class="ctl" hidden>
    <div class="ctl-h">👑 تحكم المنظم</div>
    <div id="ppl" class="ppl"></div>
    <button id="weekbtn" class="b all" type="button">📊 تقرير الأسبوع</button>
    <div id="weekbox" class="pform" hidden>
      <div class="wtabs"><button id="wk_now" class="b on" type="button">هالأسبوع</button><button id="wk_last" class="b" type="button">الأسبوع اللي فات</button></div>
      <div id="wk_body"></div>
    </div>
    <button id="lockbtn" class="b all watch" type="button">⛔ قفل الجهاز على الكل (لين وقت)</button>
    <div id="lockbox" class="pform" hidden>
      <div class="sp-h">⛔ قفل الجهاز على الكل</div>
      <div id="lockcur" class="st"></div>
      <label class="fld">يقفل <select id="lk_mode"><option value="now">من الحين</option><option value="at">من وقت أختاره</option></select></label>
      <label class="fld" id="lk_from_l" hidden>من <input id="lk_from" type="datetime-local" class="dt"></label>
      <label class="fld">يفتح <input id="lk_until" type="datetime-local" class="dt"></label>
      <div class="row"><button id="lk_go" class="b go" type="button">قفل</button><button id="lk_clear" class="b" type="button">🔓 شيل القفل</button></div>
      <div id="lknote" class="st"></div>

    <button id="saybtn" class="b all say" type="button">💬 رسالة لشاشة الكمبيوتر</button>
    <button id="voicebtn" class="b all say" type="button">🎤 رسالة صوتية للكمبيوتر</button>

      <div id="splist"></div>
      <button id="spadd" class="b allow" type="button">➕ إضافة لاعب</button>
      <div id="pform" class="pform" hidden>
        <div id="pformt" class="sp-h"></div>
        <label class="fld">الاسم <input id="pf_name" type="text" autocomplete="off"></label>
        <label class="fld">الوقت باليوم <span class="hm"><input id="pf_h" type="text" inputmode="numeric" placeholder="ساعات"><input id="pf_m" type="text" inputmode="numeric" placeholder="دقايق"></span></label>
        <label class="fld">رمز اللاعب <input id="pf_pin" type="password" autocomplete="off" placeholder="اختياري"></label>
        <label class="fld chk" id="pf_nopin_l"><input id="pf_nopin" type="checkbox"> شيل رمزه (يلعب بدون رمز)</label>
        <label class="fld">حساب ويندوز حقه <select id="pf_win"></select></label>
        <div class="row"><button id="pf_save" class="b go" type="button">حفظ</button><button id="pf_cancel" class="b" type="button">إلغاء</button></div>
      </div>
      <div class="sp-h">⏱ عام</div>
      <label class="fld">المهلة بعد ما يخلص الوقت (دقايق) <input id="s_grace_minutes" type="text" inputmode="numeric"></label>

      <label class="fld">آخر واحد ينتظر كم ساعة <input id="s_last_wait_hours" type="text" inputmode="numeric"></label>
      <label class="fld">حسابات بدون حد <input id="s_free_accounts" type="text" autocomplete="off" placeholder="مثلاً: big"></label>
      <button id="s_save" class="b go" type="button">حفظ الإعدادات</button>
      <div id="spnote" class="st"></div>
    </div>
    <button id="pinbtn" class="b all" type="button">🔑 تغيير رمز الكبير</button>
    <div id="pinbox" class="ask" hidden>

      <input id="newpin" type="password" autocomplete="off" placeholder="الرمز الجديد">
      <input id="newpin2" type="password" autocomplete="off" placeholder="أعد الرمز الجديد">
      <div class="row"><button id="pgo" class="b go" type="button">غيّر الرمز</button><button id="pcancel" class="b" type="button">إلغاء</button></div>
      <div id="pst" class="st" role="status"></div>
    </div>
    <div id="ask" class="ask" hidden>
      <div id="askt" class="askt"></div>
      <div id="adjbox" class="adjrow" hidden>
        <button id="adjm" class="b" type="button">−</button>
        <input id="adjh" type="text" inputmode="numeric" autocomplete="off" placeholder="ساعات">
        <input id="adjmin" type="text" inputmode="numeric" autocomplete="off" placeholder="دقايق">
        <button id="adjp" class="b" type="button">+</button>
      </div>
      <div id="adjnote" class="st" hidden></div>
      <textarea id="saytext" maxlength="300" placeholder="اكتب الرسالة... (مثلاً: نام الحين 😴)" hidden></textarea>
      <div id="vbox" class="vbox" hidden>
        <button id="vrec" class="b vrec" type="button">🎤 اضغط وسجّل</button>
        <div id="vst" class="st">بحد أقصى 30 ثانية</div>
        <audio id="vplay" controls hidden></audio>
      </div>
      <input id="pin" type="password" autocomplete="off" placeholder="رمز الكبير">
      <div class="row"><button id="go" class="b go" type="button">تأكيد</button><button id="cancel" class="b" type="button">إلغاء</button></div>
      <div id="st" class="st" role="status"></div>
    </div>
    <div id="livebox" class="live" hidden>
      <div class="lh"><span id="livet">📺 شاشة الكمبيوتر</span><button id="liveclose" class="b" type="button">إخفاء</button></div>
      <div id="liveans" class="ans wait"></div>
      <img id="liveimg" alt="شاشة الكمبيوتر">
      <div id="livemsg" class="st"></div>
    </div>
  </section>
  <div id="note" class="note" hidden></div>
  <div id="list"></div>
  <footer>آخر أسبوع · السجل الكامل في البرنامج</footer>
</div>

  function waitRes(topic, since, onDone, onTimeout) {

      var tm = new Date(); tm.setDate(tm.getDate() + 1); tm.setHours(16, 0, 0, 0);
      document.getElementById("lk_until").value = dtLocal(tm.getTime());
      document.getElementById("lk_from").value = dtLocal(Date.now() + 3600000);
      lknote.textContent = ""; drawLockCur();
    };
    document.getElementById("lk_mode").onchange = function () { document.getElementById("lk_from_l").hidden = this.value !== "at"; };
    document.getElementById("lk_go").onclick = function () {
      var un = new Date(document.getElementById("lk_until").value).getTime();
      var fr = document.getElementById("lk_mode").value === "at" ? new Date(document.getElementById("lk_from").value).getTime() : Date.now();
      if (!un || isNaN(un) || un <= Math.max(fr, Date.now())) { lknote.className = "st bad"; lknote.textContent = "وقت الفتح لازم يكون بعد وقت القفل"; return; }
      if (isNaN(fr)) { lknote.className = "st bad"; lknote.textContent = "اختر وقت القفل"; return; }
      lknote.textContent = "";
      confirmCfg({ op: "lockwin", from: Math.round(fr), until: Math.round(un) },
        "⛔ تقفل الجهاز على الكل " + (fr > Date.now() + 60000 ? "من " + fmtWhen(fr) : "من الحين") + " لين " + fmtWhen(un) + "؟ (اللي يلعب يطلع)");
    };
    document.getElementById("lk_clear").onclick = function () { confirmCfg({ op: "lockwin", clear: true }, "🔓 تشيل قفل الجهاز؟"); };
    document.getElementById("s_save").onclick = function () {
      var set = {}, bad = false;
      SKEYS.forEach(function (k) { var v = document.getElementById("s_" + k).value.trim();
        if (k === "free_accounts") set[k] = v; else { v = norm(v); if (!/^\d+$/.test(v)) bad = true; set[k] = parseInt(v, 10); } });
      if (bad) { spnote.className = "st bad"; spnote.textContent = "الخانات لازم تكون أرقام"; return; }
      spnote.textContent = "";
      confirmCfg({ op: "settings", set: set }, "⚙️ تحفظ الإعدادات؟");
    };
    var pinbox = document.getElementById("pinbox"), pst = document.getElementById("pst");
    // 📺 بث شاشة الكمبيوتر: يبدأ أول ما تطلع رسالتك على الشاشة، ويوقف لما يجاوب أو بعد 20 ثانية
    var livebox = document.getElementById("livebox"), liveimg = document.getElementById("liveimg"), liveans = document.getElementById("liveans");
    var livet = document.getElementById("livet"), livemsg = document.getElementById("livemsg"), liveHidden = null, liveSeen = null;
    document.getElementById("liveclose").onclick = function () { livebox.hidden = true; liveHidden = liveSeen; };
    fbValue(admin + "-live", function (ev) {
      var d; try { d = JSON.parse(ev.message); } catch (e) { return; }
      var age = Date.now() / 1000 - ev.time;
      if (d.id === liveHidden || (!d.ans && age > 40) || (d.ans && age > 900)) return;
      var first = d.id !== liveSeen; liveSeen = d.id;
      livebox.hidden = false;
      if (d.img) liveimg.src = d.img;
      var watch = d.kind === "watch";
      livemsg.textContent = (watch ? "حساب: " + d.who : "رسالتك: " + (d.text || "")) + (d.img ? "" : " · (ما قدر يصوّر الشاشة)");
      var a = watch ? (d.ans ? ["none", "⏹ انتهى البث (30 ثانية)"] : ["wait", "🔴 مباشر · باقي " + d.left + " ث"]) : { ok: ["ok", "👍 " + d.who + " جاوب: أوكي"], no: ["no", "👎 " + d.who + " جاوب: لا"],
                none: ["none", "⌛ ما جاوب"] }[d.ans] || ["wait", "⏳ ننتظر جوابه · باقي " + d.left + " ث"];
      liveans.className = "ans " + a[0]; liveans.textContent = a[1];
      livet.textContent = d.ans ? "📺 آخر صورة للشاشة · " + h12(new Date(ev.time * 1000)) : "📺 🔴 مباشر من الكمبيوتر";
      if (first) livebox.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    document.getElementById("watchbtn").onclick = function () {
      pending = { cmd: "watch", who: "screen" }; ask.hidden = false; pinbox.hidden = true; st.textContent = ""; st.className = "st";
      adjbox.hidden = adjnote.hidden = saytext.hidden = vbox.hidden = true;
      askt.textContent = "📺 تشوف شاشة الكمبيوتر 30 ثانية؟ (يطلع 📺 صغير بزاوية الشاشة)"; pinI.value = ""; pinI.focus();
    };
    // 🎤 رسالة صوتية: نسجّل WAV (16kHz) بالجوال، ونرفعه للقاعدة، والكمبيوتر يشغّله
    var vbox = document.getElementById("vbox"), vrec = document.getElementById("vrec"), vst = document.getElementById("vst"), vplay = document.getElementById("vplay");
    var voiceB64 = null, recState = null;
    function wavB64(chunks, rate) {
      var len = chunks.reduce(function (a, c) { return a + c.length; }, 0), ratio = rate / 16000, n = Math.floor(len / ratio);
      var all = new Float32Array(len), o = 0; chunks.forEach(function (c) { all.set(c, o); o += c.length; });
      var buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      function str(off, t) { for (var i = 0; i < t.length; i++) v.setUint8(off + i, t.charCodeAt(i)); }
      str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt "); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
      v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
      var peak = 0.05; for (var j = 0; j < len; j++) peak = Math.max(peak, Math.abs(all[j]));
      var gain = Math.min(4, 0.9 / peak);                       // نرفع الصوت لو كان واطي
      for (var k = 0; k < n; k++) { var x = Math.max(-1, Math.min(1, all[Math.floor(k * ratio)] * gain)); v.setInt16(44 + k * 2, x * 32767, true); }
      var bytes = new Uint8Array(buf), bin = ""; for (var q = 0; q < bytes.length; q += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(q, q + 8192));
      return btoa(bin);
    }
    function stopRec() {
      if (!recState) return;
      var r = recState; recState = null; clearInterval(r.timer);
      try { r.proc.disconnect(); r.src.disconnect(); r.stream.getTracks().forEach(function (t) { t.stop(); }); r.ctx.close(); } catch (e) {}
      vrec.classList.remove("on"); vrec.textContent = "🎤 سجّل من جديد";
      if (r.chunks.length < 4) { vst.textContent = "قصير مرة، سجّل مرة ثانية"; return; }
      voiceB64 = wavB64(r.chunks, r.ctx.sampleRate);
      vplay.src = "data:audio/wav;base64," + voiceB64; vplay.hidden = false;
      vst.textContent = "✅ جاهز (" + Math.round((Date.now() - r.start) / 1000) + " ث). اسمعه، واكتب رمزك وأرسل.";
      pinI.focus();
    }
    vrec.onclick = function () {
      if (recState) { stopRec(); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { vst.textContent = "الجوال ما يسمح بالمايك هنا. حدّث تطبيق وقتي."; return; }
      navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (stream) {
        var ctx = new (window.AudioContext || window.webkitAudioContext)(), src = ctx.createMediaStreamSource(stream);
        var proc = ctx.createScriptProcessor(4096, 1, 1), chunks = [];
        proc.onaudioprocess = function (e) { chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
        src.connect(proc); proc.connect(ctx.destination);
        recState = { stream: stream, ctx: ctx, src: src, proc: proc, chunks: chunks, start: Date.now() };
        voiceB64 = null; vplay.hidden = true;
        vrec.classList.add("on"); vrec.textContent = "⏹ وقّف التسجيل";
        recState.timer = setInterval(function () {
          if (!recState) return;
          var sec = Math.round((Date.now() - recState.start) / 1000); vst.textContent = "🔴 يسجّل... " + sec + " ث";
          if (sec >= 30) stopRec();
        }, 250);
      }).catch(function () { vst.textContent = "ما قدرت أفتح المايك. اسمح لتطبيق وقتي بالمايك."; });
    };
    document.getElementById("voicebtn").onclick = function () {
      pending = { cmd: "voice", who: "" }; ask.hidden = false; pinbox.hidden = true; st.textContent = ""; st.className = "st";
      adjbox.hidden = adjnote.hidden = saytext.hidden = true; vbox.hidden = false; voiceB64 = null; vplay.hidden = true;
      vrec.textContent = "🎤 اضغط وسجّل"; vst.textContent = "بحد أقصى 30 ثانية";
      askt.textContent = "🎤 سجّل رسالتك، وتشتغل بصوت على الكمبيوتر"; pinI.value = "";
      ask.scrollIntoView({ behavior: "smooth", block: "center" });
    };
    document.getElementById("saybtn").onclick = function () {
      pending = { cmd: "say", who: "" }; ask.hidden = false; pinbox.hidden = true; st.textContent = ""; st.className = "st";
      adjbox.hidden = adjnote.hidden = vbox.hidden = true; saytext.hidden = false; saytext.value = "";
      askt.textContent = "💬 وش تبي يطلع على شاشة الكمبيوتر؟"; pinI.value = ""; saytext.focus();
    };
    document.getElementById("pinbtn").onclick = function () { pinbox.hidden = false; ask.hidden = true; pst.textContent = "";
      ["oldpin", "newpin", "newpin2"].forEach(function (i) { document.getElementById(i).value = ""; }); document.getElementById("oldpin").focus(); };
    document.getElementById("pcancel").onclick = function () { pinbox.hidden = true; };
    document.getElementById("pgo").onclick = function () {
      var o = document.getElementById("oldpin").value, n1 = document.getElementById("newpin").value, n2 = document.getElementById("newpin2").value;
      if (!o.trim() || !n1.trim()) { pst.className = "st bad"; pst.textContent = "اكتب الرمز الحالي والجديد"; return; }
      if (n1 !== n2) { pst.className = "st bad"; pst.textContent = "الرمزين الجديدة مو نفس بعض"; return; }
      var ts = String(Date.now()), id = Math.random().toString(36).slice(2, 10), since = Math.floor(Date.now() / 1000) - 5;
      pst.className = "st"; pst.textContent = "يرسل...";
      Promise.all([sha("waqti:" + norm(o)), sha("waqti:" + norm(n1))]).then(function (hs) {
        return sha(hs[0] + "set_pin|" + hs[1] + "|" + ts).then(function (p) {
          return fbPush(admin + "-ok", { cmd: "set_pin", who: hs[1], ts: ts, id: id, p: p });
        });
      }).then(function () {
        pst.textContent = "انرسل. ننتظر الكمبيوتر...";
        waitRes(admin + "-res-" + id, since, function (done) {
          var ok = done.indexOf("✅") >= 0; pst.className = "st " + (ok ? "okc" : "bad"); pst.textContent = ok ? "✅ تغيّر الرمز" : done;
          if (ok) setTimeout(function () { pinbox.hidden = true; }, 2500);
        }, function () { pst.className = "st okc"; pst.textContent = "الكمبيوتر طافي. انحفظ ✅ ويتغيّر أول ما يشتغل"; });
      }).catch(function () { pst.className = "st bad"; pst.textContent = "ما انرسل. تأكد من النت."; });
    };
    document.getElementById("cancel").onclick = function () { ask.hidden = true; pending = null; };
    function sha(sv) { return crypto.subtle.digest("SHA-256", new TextEncoder().encode(sv)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }); }
    function norm(sv) { return sv.trim().replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; }).replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 1776; }); }
    document.getElementById("go").onclick = function () {
      if (!pending) { st.className = "st bad"; st.textContent = "اختر اسم أول: «طلّعه» أو «اسمح له»"; return; }
      if (!pinI.value.trim()) { st.className = "st bad"; st.textContent = "اكتب الرمز"; return; }
      var ts = String(Date.now()), id = Math.random().toString(36).slice(2, 10), cmd = pending.cmd, who = pending.who;
      var upload = Promise.resolve();
      if (cmd === "voice") {
        if (recState) stopRec();
        if (!voiceB64) { st.className = "st bad"; st.textContent = "سجّل الرسالة أول"; return; }
        var vid = id, b64 = voiceB64;
        upload = sha(b64).then(function (hsh) {
          who = vid + ":" + hsh;
          return fetch(FB + fbPath(admin + "-voice") + "/" + vid + ".json", { method: "PUT",
            body: JSON.stringify({ m: b64, t: { ".sv": "timestamp" } }) }).then(function (r) { if (!r.ok) throw new Error("http " + r.status); });
        });
      }
      if (cmd === "say") {
        who = saytext.value.trim();
        if (!who) { st.className = "st bad"; st.textContent = "اكتب الرسالة"; return; }
      }
      if (cmd === "adjust") {
        var mins = adjTotal();
        if (mins <= 0 || mins > 1440) { st.className = "st bad"; st.textContent = "اكتب الساعات أو الدقايق (لين 24 ساعة)"; return; }
        cmd = "adjust:" + (adjSign * mins);
      }
      var since = Math.floor(Date.now() / 1000) - 5;
      st.className = "st"; st.textContent = "يرسل...";
      upload.then(function () { return sha("waqti:" + norm(pinI.value)); }).then(function (h) { return sha(h + cmd + "|" + who + "|" + ts); }).then(function (p) {
        return fbPush(admin + "-ok", { cmd: cmd, who: who, ts: ts, id: id, p: p });
      }).then(function () {
        st.textContent = "انرسل. ننتظر الكمبيوتر...";
        waitRes(admin + "-res-" + id, since, function (done) {
          var ok = done.indexOf("✅") >= 0; st.className = "st " + (ok ? "okc" : "bad"); st.textContent = done;
          if (ok) setTimeout(function () { ask.hidden = true; }, 2500);
        }, function () { st.className = "st okc"; st.textContent = cmd === "watch" ? "ما أحد قدام الكمبيوتر (الشاشة مقفلة) أو هو طافي" : (cmd === "say" || cmd === "voice") ? "ما أحد قدام الكمبيوتر أو هو طافي. انحفظت ✅ وتطلع أول ما يفتح (خلال 12 ساعة)" : /^(adjust|reset)/.test(cmd) ? "الكمبيوتر طافي. انحفظ ✅ ويتنفذ أول ما يشتغل (لو اشتغل اليوم)" : "الكمبيوتر طافي. انحفظ ✅ ويتنفذ أول ما يشتغل"; });
      }).catch(function () { st.className = "st bad"; st.textContent = "ما انرسل. تأكد من النت."; });
    };
  }
  render();
  if (!topic) { live(false); return; }
  var redraw = null;
  function later() { clearTimeout(redraw); redraw = setTimeout(render, 150); }
  if (admin) fbList(admin, function (ev) { addAdmin(ev); later(); });
  fbList(topic, function (ev) { add(ev).then(later); }, function () { live(true); }, function () { live(false); });
})();
</script>
